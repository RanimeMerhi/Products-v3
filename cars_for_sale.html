<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicles</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" href="./tab_icon.png" />
<style>
  :root {
  --olx-yellow: #FCDE68;
  --olx-blue: #2d65f2;
  --card-blue: #69c8f3;
  --text: #111;
  --muted: #5a5a5a;
  --card-bg: #ffffff;
  --page-bg: #f3f3f3;
}

/* Page */
body {
  background: var(--page-bg);
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--text);
}

/* Header */
.header {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  padding: 18px 20px;
  background: transparent;
}

.header img {
  max-width: 220px;
  max-height: 90px;
  object-fit: contain;
}

/* Mobile */
@media (max-width: 767px) {
  .header img {
    max-width: 170px !important;
    max-height: 70px !important;
  }

  .language-toggle {
    top: 18px !important;
    right: 14px !important;
  }

  .language-toggle button {
    margin: 0 4px !important;
  }
}

/* Back button */
.back-button {
  position: absolute;
  left: 20px;
  top: 20px;
  padding: 8px 14px;
  background-color: var(--olx-blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.back-button:hover {
  background-color: var(--olx-blue);
  text-decoration: none;
  color: #fff;
}
.no-results {
  grid-column: 1 / -1;
  text-align: center;
}
/* Main container */
.container {
  max-width: 980px;
  margin: 0 auto;
  padding: 10px 20px 40px;
}

/* Title */
#main-title {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  margin: 10px 0 22px;
  color: #111;
}

/* Search */
.search-box {
  max-width: 980px;
  margin: 0 auto 22px;
  border: 1px solid var(--olx-yellow);
  background: #fff;
  padding: 8px 14px;
  border-radius: 18px;
}

.search-box input[type="text"] {
  width: 100%;
  padding: 10px 6px;
  border: none;
  background: transparent;
  font-size: 16px;
  outline: none;
}

.search-box input[type="text"]::placeholder {
  color: #aaa;
}

/* Grid */
.product-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 26px 20px;
  justify-items: center;
  align-items: start;
  margin: 0 auto;
  max-width: 760px;
  padding: 0;
}

.product-item {
  width: 100%;
  display: flex;
  justify-content: center;
}

/* Card */
.featured-card {
  position: relative;
  width: 126px;
  min-height: 118px;
  background: var(--card-bg);
  border: 1.5px solid var(--card-blue);
  border-radius: 18px;
  padding: 12px 10px 12px 10px;
  box-sizing: border-box;
}

.price-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 54px;
  height: 54px;
  background: var(--card-blue);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.1;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.14);
  padding: 6px;
}

.card-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  margin: 0 0 8px 0;
  line-height: 1.15;
  max-width: 88px;
}

.card-duration {
  font-size: 10px;
  font-weight: 400;
  color: #333;
  margin: 0;
  line-height: 1.25;
  max-width: 95px;
}

/* Language toggle */
.language-toggle {
  display: flex;
  gap: 10px;
  position: absolute;
  right: 20px;
  top: 24px;
}

#en-button,
#ar-button {
  display: inline-block;
  outline: 0;
  cursor: pointer;
  border-radius: 6px;
  border: 2px solid var(--olx-yellow);
  color: #111;
  background: transparent;
  padding: 6px 10px;
  font-size: 12px;
  box-shadow: rgba(0, 0, 0, 0.07) 0px 2px 4px 0px,
              rgba(0, 0, 0, 0.05) 0px 1px 1.5px 0px;
  min-height: 34px;
}

#en-button:hover,
#ar-button:hover {
  background-color: var(--olx-yellow);
  color: #111;
}

/* Footer */
footer {
  background-color: var(--olx-yellow);
  color: #111;
  text-align: center;
  padding: 0.5rem;
  font-size: 0.8rem;
  width: 100%;
  margin-top: 36px;
}

footer p {
  margin: 0;
  padding: 0;
  font-size: 0.8rem;
}

/* Responsive */
@media (max-width: 991px) {
  .product-container {
    grid-template-columns: repeat(3, 1fr);
    max-width: 560px;
  }
}

@media (max-width: 767px) {
  .product-container {
    grid-template-columns: repeat(2, 1fr);
    max-width: 280px;
    gap: 22px 16px;
  }

  #main-title {
    font-size: 24px;
  }

  .featured-card {
    width: 122px;
    min-height: 114px;
  }
}

@media (max-width: 480px) {
  footer {
    padding: 0.3rem;
    font-size: 0.7rem;
  }
}
  </style>
</head>

<body>
  <div class="header">
    <a href="vehicles.html" class="back-button" id="back-button">← Back</a>

    <a href="https://www.dubizzle.com.lb/">
      <img src="https://cdn.empgroup.com/wp-content/uploads/2023/04/dubizzle-logo-fix-width1.png" alt="Marketplace Logo" />
    </a>
  </div>

  <div class="language-toggle">
    <button id="en-button">EN</button>
    <button id="ar-button">AR</button>
  </div>

  <div class="container">
    <h1 id="main-title" class="my-4">Cars for Sale</h1>

    <div class="search-box">
      <input type="text" id="search-input" class="form-control" placeholder="Search..." />
    </div>

<div id="products" class="product-container"></div>
  </div>

  <footer>
    <p>&copy; 2025 Product Listings</p>
  </footer>

  <script type="module">
    import { initializeProductPage } from './langscript.js';

    const l1Category = 'Vehicles';
    const l2Category = 'Cars for Sale';
    let allProducts = [];
    //initializeProductPage(l1Category, l2Category);

    let currentLanguage = localStorage.getItem('selectedLanguage') || 'en';

    const productsContainer = document.getElementById('products');
    const searchInput = document.getElementById('search-input');
    const enButton = document.getElementById('en-button');
    const arButton = document.getElementById('ar-button');
    const titleElement = document.getElementById('main-title');

    function formatPrice(price) {
      if (price === null || price === undefined || price === '') return 'Free';
      return String(price).startsWith('$') ? String(price) : `$${price}`;
    }

    function getExtraText(productType, language) {
      const texts = {
        en: {
          featured_ad: 'Ad will appear in the featured Ads section',
          auto_refresh_ad: 'Your ad will be refreshed automatically',
          elite_ad: 'Your ad will get premium visibility',
          free_ad: 'Basic ad package',
          default: 'Special package for your listing'
        },
        ar: {
          featured_ad: 'سيظهر الإعلان في قسم الإعلانات المميزة',
          auto_refresh_ad: 'سيتم تحديث إعلانك تلقائياً',
          elite_ad: 'سيحصل إعلانك على ظهور مميز',
          free_ad: 'باقة إعلان أساسية',
          default: 'باقة مميزة لإعلانك'
        }
      };

      return texts[language][productType] || texts[language].default;
    }

    function renderProducts(products) {
      productsContainer.innerHTML = '';

      if (!products.length) {
        productsContainer.innerHTML = `
          <div class="no-results">
            <p>No products found.</p>
          </div>
        `;
        return;
      }

      products.forEach(product => {
        const productName =
          currentLanguage === 'ar'
            ? (product.product_package_name_ar || product.product_package_name_en || '')
            : (product.product_package_name_en || '');

        const productDesc =
          currentLanguage === 'ar'
            ? (product.product_package_descr_ar || product.product_package_descr_en || '')
            : (product.product_package_descr_en || '');

        const card = document.createElement('div');
        card.className = 'product-item';

        card.innerHTML = `
          <div class="featured-card">
            <div class="price-badge">${formatPrice(product.price)}</div>
            <h3 class="card-title">${productName}</h3>
            <p class="card-duration">${productDesc}</p>
          </div>
        `;

        productsContainer.appendChild(card);
      });
    }

    async function fetchAndDisplayProducts() {
      try {
        const response = await fetch('VAS-SHEET.json');
        const data = await response.json();

        let products = data.filter(
          product => product.l1 === l1Category && product.l2 === l2Category
        );

        const hasPlace1AdProduct = products.some(product =>
          (product.product_package_name_en || '').includes('Place 1 Ad for')
        );

        if (!hasPlace1AdProduct) {
          products.push({
            l1: l1Category,
            l2: l2Category,
            product_package_name_en: 'Featured Ad for 3 days',
            product_package_name_ar: 'إعلان مميز لمدة 3 أيام',
            product_package_descr_en: 'Boost your ad visibility',
            product_package_descr_ar: 'عزّز ظهور إعلانك',
            price: '16.15',
            product_type: 'featured_ad'
          });
        }

        const generalProducts = data.filter(
          product => product.l1 === l1Category && product.l2 === 'GENERAL'
        );

        const existingProductNames = new Set(
          products.map(product => `${product.l2}_${product.product_package_name_en}`)
        );

        generalProducts.forEach(generalProduct => {
          const productKey = `${l2Category}_${generalProduct.product_package_name_en}`;
          if (!existingProductNames.has(productKey)) {
            products.push({
              ...generalProduct,
              l2: l2Category
            });
            existingProductNames.add(productKey);
          }
        });

        const uniqueProducts = [];
        const uniqueKeys = new Set();

        products.forEach(product => {
          const productKey = `${product.l2}_${product.product_package_name_en}`;
          if (!uniqueKeys.has(productKey)) {
            uniqueProducts.push(product);
            uniqueKeys.add(productKey);
          }
        });

        const productTypeOrder = {
          ad_limit_bump: 1,
          featured_ad: 2,
          auto_refresh_ad: 3,
          elite_ad: 4,
          free_ad: 5
        };

        uniqueProducts.sort((a, b) => {
          const typeA = productTypeOrder[a.product_type] || 999;
          const typeB = productTypeOrder[b.product_type] || 999;
          return typeA - typeB;
        });

        allProducts = uniqueProducts;
        applySearch();
      } catch (error) {
        console.error('Error loading products:', error);
        productsContainer.innerHTML = `
          <div class="col-12 text-center">
            <p>Failed to load products.</p>
          </div>
        `;
      }
    }
    function applySearch() {
    const searchQuery = searchInput.value.toLowerCase().trim();

    const filteredProducts = allProducts.filter(product => {
      const name =
        currentLanguage === 'ar'
          ? (product.product_package_name_ar || product.product_package_name_en || '')
          : (product.product_package_name_en || '');

      return name.toLowerCase().includes(searchQuery);
    });

    renderProducts(filteredProducts);
  }
  searchInput.addEventListener('input', applySearch);
    function changeLanguage(language) {
      currentLanguage = language;
      localStorage.setItem('selectedLanguage', language);

      if (language === 'ar') {
        titleElement.textContent = 'سيارات للبيع';
        searchInput.placeholder = 'ابحث...';
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'ar');
      } else {
        titleElement.textContent = 'Cars for Sale';
        searchInput.placeholder = 'Search...';
        document.documentElement.setAttribute('dir', 'ltr');
        document.documentElement.setAttribute('lang', 'en');
      }

      updateUrlParameter('lang', language);
      fetchAndDisplayProducts();
    }

    function updateUrlParameter(param, value) {
      const url = new URL(window.location);
      url.searchParams.set(param, value);
      window.history.replaceState({}, '', url);
    }

    enButton.addEventListener('click', () => changeLanguage('en'));
    arButton.addEventListener('click', () => changeLanguage('ar'));

    changeLanguage(currentLanguage);
  </script>
</body>
</html>
