<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicles</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" href="./tab_icon.png" />

  <style>
    body {
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .header img {
      height: 40px;
      object-fit: contain;
    }

    .back-button {
      text-decoration: none;
      color: #111;
      font-weight: 600;
    }

    .language-toggle {
      text-align: right;
      padding: 10px 24px 0;
    }

    .language-toggle button {
      border: 1px solid #ddd;
      background: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 8px;
    }

    .container {
      padding-top: 20px;
      padding-bottom: 40px;
    }

    #main-title {
      font-size: 36px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
    }

    .search-box {
      max-width: 400px;
      margin-bottom: 30px;
    }

    .product-container {
      row-gap: 28px;
    }

    .product-col {
      display: flex;
      justify-content: center;
    }

    .featured-card {
      position: relative;
      width: 180px;
      min-height: 150px;
      background: #f9f9f9;
      border: 1.5px solid #7bc9ee;
      border-radius: 18px;
      padding: 18px 16px;
      box-sizing: border-box;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .featured-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .price-badge {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 62px;
      height: 62px;
      background: #69c8f3;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.14);
      padding: 6px;
    }

    .featured-card h3 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin: 0 0 10px;
      line-height: 1.2;
      max-width: 110px;
    }

    .featured-card .duration {
      font-size: 15px;
      font-weight: 600;
      color: #111;
      margin: 0 0 10px;
      line-height: 1.35;
    }

    .featured-card .subtext {
      font-size: 13px;
      color: #5a5a5a;
      margin: 0;
      line-height: 1.4;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 14px;
    }

    html[dir="rtl"] body {
      text-align: right;
    }
  </style>
</head>

<body>
  <div class="header">
    <a href="vehicles.html" class="back-button" id="back-button">← Back</a>

    <a href="https://www.dubizzle.com.lb/">
      <img src="https://cdn.empgroup.com/wp-content/uploads/2023/04/dubizzle-logo-fix-width1.png" alt="Marketplace Logo" />
    </a>
  </div>

  <div class="language-toggle">
    <button id="en-button">EN</button>
    <button id="ar-button">AR</button>
  </div>

  <div class="container">
    <h1 id="main-title" class="my-4">Cars for Sale</h1>

    <div class="search-box">
      <input type="text" id="search-input" class="form-control" placeholder="Search..." />
    </div>

    <div id="products" class="row product-container"></div>
  </div>

  <footer>
    <p>&copy; 2025 Product Listings</p>
  </footer>

  <script type="module">
    import { initializeProductPage } from './langscript.js';

    const l1Category = 'Vehicles';
    const l2Category = 'Cars for Sale';

    initializeProductPage(l1Category, l2Category);

    let currentLanguage = localStorage.getItem('selectedLanguage') || 'en';

    const productsContainer = document.getElementById('products');
    const searchInput = document.getElementById('search-input');
    const enButton = document.getElementById('en-button');
    const arButton = document.getElementById('ar-button');
    const titleElement = document.getElementById('main-title');

    function formatPrice(price) {
      if (price === null || price === undefined || price === '') return 'Free';
      return String(price).startsWith('$') ? String(price) : `$${price}`;
    }

    function getExtraText(productType, language) {
      const texts = {
        en: {
          featured_ad: 'Ad will appear in the featured Ads section',
          auto_refresh_ad: 'Your ad will be refreshed automatically',
          elite_ad: 'Your ad will get premium visibility',
          free_ad: 'Basic ad package',
          default: 'Special package for your listing'
        },
        ar: {
          featured_ad: 'سيظهر الإعلان في قسم الإعلانات المميزة',
          auto_refresh_ad: 'سيتم تحديث إعلانك تلقائياً',
          elite_ad: 'سيحصل إعلانك على ظهور مميز',
          free_ad: 'باقة إعلان أساسية',
          default: 'باقة مميزة لإعلانك'
        }
      };

      return texts[language][productType] || texts[language].default;
    }

    function renderProducts(products) {
      productsContainer.innerHTML = '';

      if (!products.length) {
        productsContainer.innerHTML = `
          <div class="col-12 text-center">
            <p>No products found.</p>
          </div>
        `;
        return;
      }

      products.forEach(product => {
        const productName =
          currentLanguage === 'ar'
            ? (product.product_package_name_ar || product.product_package_name_en || '')
            : (product.product_package_name_en || '');

        const productDesc =
          currentLanguage === 'ar'
            ? (product.product_package_descr_ar || product.product_package_descr_en || '')
            : (product.product_package_descr_en || '');

        const card = document.createElement('div');
        card.className = 'col-lg-3 col-md-4 col-sm-6 col-12 product-col';

        card.innerHTML = `
          <div class="featured-card">
            <div class="price-badge">${formatPrice(product.price)}</div>
            <h3>${productName}</h3>
            <p class="duration">${productDesc}</p>
            <p class="subtext">${getExtraText(product.product_type, currentLanguage)}</p>
          </div>
        `;

        productsContainer.appendChild(card);
      });
    }

    async function fetchAndDisplayProducts() {
      try {
        const response = await fetch('VAS-SHEET.json');
        const data = await response.json();

        let products = data.filter(
          product => product.l1 === l1Category && product.l2 === l2Category
        );

        const hasPlace1AdProduct = products.some(product =>
          (product.product_package_name_en || '').includes('Place 1 Ad for')
        );

        if (!hasPlace1AdProduct) {
          products.push({
            l1: l1Category,
            l2: l2Category,
            product_package_name_en: 'Featured Ad for 3 days',
            product_package_name_ar: 'إعلان مميز لمدة 3 أيام',
            product_package_descr_en: 'Boost your ad visibility',
            product_package_descr_ar: 'عزّز ظهور إعلانك',
            price: '16.15',
            product_type: 'featured_ad'
          });
        }

        const generalProducts = data.filter(
          product => product.l1 === l1Category && product.l2 === 'GENERAL'
        );

        const existingProductNames = new Set(
          products.map(product => `${product.l2}_${product.product_package_name_en}`)
        );

        generalProducts.forEach(generalProduct => {
          const productKey = `${l2Category}_${generalProduct.product_package_name_en}`;
          if (!existingProductNames.has(productKey)) {
            products.push({
              ...generalProduct,
              l2: l2Category
            });
            existingProductNames.add(productKey);
          }
        });

        const uniqueProducts = [];
        const uniqueKeys = new Set();

        products.forEach(product => {
          const productKey = `${product.l2}_${product.product_package_name_en}`;
          if (!uniqueKeys.has(productKey)) {
            uniqueProducts.push(product);
            uniqueKeys.add(productKey);
          }
        });

        const productTypeOrder = {
          ad_limit_bump: 1,
          featured_ad: 2,
          auto_refresh_ad: 3,
          elite_ad: 4,
          free_ad: 5
        };

        uniqueProducts.sort((a, b) => {
          const typeA = productTypeOrder[a.product_type] || 999;
          const typeB = productTypeOrder[b.product_type] || 999;
          return typeA - typeB;
        });

        renderProducts(uniqueProducts);

        searchInput.addEventListener('input', function () {
          const searchQuery = this.value.toLowerCase();

          const filteredProducts = uniqueProducts.filter(product => {
            const name =
              currentLanguage === 'ar'
                ? (product.product_package_name_ar || product.product_package_name_en || '')
                : (product.product_package_name_en || '');

            return name.toLowerCase().includes(searchQuery);
          });

          renderProducts(filteredProducts);
        });
      } catch (error) {
        console.error('Error loading products:', error);
        productsContainer.innerHTML = `
          <div class="col-12 text-center">
            <p>Failed to load products.</p>
          </div>
        `;
      }
    }

    function changeLanguage(language) {
      currentLanguage = language;
      localStorage.setItem('selectedLanguage', language);

      if (language === 'ar') {
        titleElement.textContent = 'سيارات للبيع';
        searchInput.placeholder = 'ابحث...';
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'ar');
      } else {
        titleElement.textContent = 'Cars for Sale';
        searchInput.placeholder = 'Search...';
        document.documentElement.setAttribute('dir', 'ltr');
        document.documentElement.setAttribute('lang', 'en');
      }

      updateUrlParameter('lang', language);
      fetchAndDisplayProducts();
    }

    function updateUrlParameter(param, value) {
      const url = new URL(window.location);
      url.searchParams.set(param, value);
      window.history.replaceState({}, '', url);
    }

    enButton.addEventListener('click', () => changeLanguage('en'));
    arButton.addEventListener('click', () => changeLanguage('ar'));

    changeLanguage(currentLanguage);
  </script>
</body>
</html>
